<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Q&A — RAG Demo</title>
    <style>
      :root {
        --bg: #f7f7f6;
        --card: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e3e3e0;
        --accent: #2f6f4f;
        --warn: #8a5a00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        font: 16px/1.55 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
      form { display: flex; gap: 8px; margin-bottom: 8px; }
      input[type="text"] {
        flex: 1; padding: 12px 14px; border: 1px solid var(--line);
        border-radius: 8px; font-size: 16px; background: var(--card);
      }
      button {
        padding: 12px 18px; border: 0; border-radius: 8px; background: var(--ink);
        color: #fff; font-size: 15px; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .examples { font-size: 13px; color: var(--muted); margin: 4px 0 28px; }
      .examples a { color: var(--accent); cursor: pointer; text-decoration: underline; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 18px 20px; margin-top: 16px;
      }
      .answer { white-space: pre-wrap; }
      .refusal { color: var(--warn); }
      .label {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--muted); margin: 0 0 8px;
      }
      .sources { margin-top: 18px; }
      details {
        border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
        margin-top: 8px; background: #fbfbfa;
      }
      summary { cursor: pointer; font-size: 14px; }
      summary .score { color: var(--muted); font-weight: normal; }
      .passage { white-space: pre-wrap; font-size: 14px; color: #333; margin-top: 8px; }
      .error { color: #b00020; }
      .spinner { color: var(--muted); font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Document Q&amp;A</h1>
      <p class="sub">
        Ask about the sample knowledge base (Meridian Coffee Roasters). Answers are
        drawn only from the documents, with the source passages shown. When the
        answer isn't in the documents, it says so instead of making one up.
      </p>

      <form id="ask-form">
        <input id="q" type="text" placeholder="Ask a question about the documents…" autocomplete="off" />
        <button id="submit" type="submit">Ask</button>
      </form>
      <div class="examples">
        Try:
        <a data-q="How long do I have to return unopened coffee?">a real one</a> ·
        <a data-q="What is the capital of France?">one that isn't in the docs</a>
      </div>

      <div id="out"></div>
    </main>

    <script>
      const form = document.getElementById("ask-form");
      const input = document.getElementById("q");
      const submit = document.getElementById("submit");
      const out = document.getElementById("out");

      document.querySelectorAll(".examples a").forEach((a) => {
        a.addEventListener("click", () => {
          input.value = a.dataset.q;
          form.requestSubmit();
        });
      });

      function esc(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }

      function renderSources(sources) {
        if (!sources.length) return "";
        const items = sources
          .map(
            (s) => `
            <details>
              <summary>${esc(s.source)} · chunk ${s.chunk_index}
                <span class="score">(similarity ${s.score})</span></summary>
              <div class="passage">${esc(s.text)}</div>
            </details>`
          )
          .join("");
        return `<div class="sources"><p class="label">Sources</p>${items}</div>`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        submit.disabled = true;
        out.innerHTML = '<div class="card spinner">Searching the documents…</div>';

        try {
          const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await res.json();

          if (!res.ok) {
            out.innerHTML = `<div class="card error">${esc(data.error || "Something went wrong.")}</div>`;
            return;
          }

          const answerClass = data.grounded ? "answer" : "answer refusal";
          out.innerHTML = `
            <div class="card">
              <p class="label">${data.grounded ? "Answer" : "Not in the documents"}</p>
              <div class="${answerClass}">${esc(data.answer)}</div>
              ${renderSources(data.sources)}
            </div>`;
        } catch (err) {
          out.innerHTML = `<div class="card error">Network error: ${esc(err.message)}</div>`;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
