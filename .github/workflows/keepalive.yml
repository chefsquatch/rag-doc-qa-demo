# Keeps the free Render instance awake by pinging it every ~10 minutes, so the
# live demo doesn't cold-start (~50s) for a visitor after a period of inactivity.
# A single always-on free web service stays within Render's free monthly hours.
#
# Note: GitHub disables scheduled workflows after 60 days with no repo activity,
# and cron timing is best-effort (can lag). For rock-solid uptime, point an
# external monitor (e.g. UptimeRobot, 5-min interval) at /health instead.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live demo health endpoint
        # `|| true` so a cold-start timeout never marks the run failed (no noise).
        run: curl -fsS --max-time 90 https://rag-doc-qa-demo.onrender.com/health || true
